[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]   
"backend/app/api/*.py" = ["B008"]
"backend/app/services/candidate_matching.py" = ["UP046", "UP047"]