[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # Long legacy migration, test, and generated-data lines
    "UP046",  # Keep compatible Generic syntax
    "UP047",  # Keep compatible generic function syntax
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/uploads.py" = ["B008"]
