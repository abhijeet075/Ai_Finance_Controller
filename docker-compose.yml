services:
  postgres:
    image: postgres:17
    container_name: finance-controller-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_controller
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    ports:
      - "5432:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_controller"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_postgres_data:
